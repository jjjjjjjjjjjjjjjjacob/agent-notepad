name: Vouch contributor policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, closed]
  push:
    branches: [main]
  workflow_dispatch:

# Serialize refreshes and never cancel a run while it is invalidating statuses.
concurrency:
  group: vouch-policy
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'jjjjjjjjjjjjjjjjacob/agent-notepad'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      matrix: ${{ steps.snapshot.outputs.matrix }}
      any: ${{ steps.snapshot.outputs.any }}
    steps:
      - id: snapshot
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.eventName === 'workflow_dispatch' &&
                (context.actor !== 'jjjjjjjjjjjjjjjjacob' || context.ref !== 'refs/heads/main')) {
              throw new Error('Only Jacob may manually recheck from main');
            }
            const repo = context.repo;
            const eventHead = context.payload.pull_request?.head?.sha;
            if (eventHead) {
              await github.rest.repos.createCommitStatus({ ...repo, sha: eventHead, state: 'pending',
                context: 'Vouch / trusted contributor', description: 'Refreshing PR author and head policy' });
            }
            const prs = await github.paginate(github.rest.pulls.list, { ...repo, state: 'open', base: 'main', per_page: 100 });
            for (const sha of new Set(prs.map(pr => pr.head.sha))) {
              await github.rest.repos.createCommitStatus({ ...repo, sha, state: 'pending',
                context: 'Vouch / trusted contributor', description: 'Checking canonical contributor trust' });
            }
            // Leave every head pending if a repository outgrows matrix capacity.
            if (prs.length > 256) throw new Error('More than 256 open PRs: all pending; expand refresh batching');
            const base = (await github.rest.repos.getBranch({ ...repo, branch: 'main' })).data.commit.sha;
            const include = prs.map(pr => ({ number: pr.number, sha: pr.head.sha, author: pr.user.login, base }));
            core.setOutput('matrix', JSON.stringify({ include }));
            core.setOutput('any', include.length > 0 ? 'true' : 'false');
  evaluate:
    needs: prepare
    if: needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: vouch
        continue-on-error: true
        uses: mitchellh/vouch/action/check-user@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          user: ${{ matrix.author }}
          repo: jjjjjjjjjjjjjjjjacob/agent-notepad
          vouched-repo: jjjjjjjjjjjjjjjjacob/agent-notepad
          vouched-file: .github/VOUCHED.td
          allow-fail: 'true'
      - name: Write narrow evaluation result
        if: always()
        env:
          VOUCH_STATUS: ${{ steps.vouch.outputs.status }}
        run: |
          mkdir result
          node -e "const s=process.env.VOUCH_STATUS; require('fs').writeFileSync('result/status.txt', ['vouched','collaborator','bot','unknown','denounced'].includes(s) ? s : 'unknown')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vouch-${{ matrix.number }}-${{ matrix.sha }}
          path: result/status.txt
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [prepare, evaluate]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Trusted canonical code only. Evaluator output is data, never code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jjjjjjjjjjjjjjjjacob/agent-notepad
          ref: ${{ matrix.base }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: result
        continue-on-error: true
        with:
          name: vouch-${{ matrix.number }}-${{ matrix.sha }}
          path: ${{ runner.temp }}/vouch-result
      - if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VOUCH_SNAPSHOT: ${{ toJSON(matrix) }}
          EVALUATION_OK: ${{ needs.evaluate.result == 'success' && steps.result.outcome == 'success' }}
          VOUCH_RESULT_FILE: ${{ runner.temp }}/vouch-result/status.txt
        with:
          script: |
            const { finalize, readEvaluation } = require('./.github/scripts/vouch-gate.cjs');
            const actionStatus = readEvaluation(process.env.VOUCH_RESULT_FILE, process.env.EVALUATION_OK === 'true');
            await finalize({ github, context, core,
              snapshot: JSON.parse(process.env.VOUCH_SNAPSHOT), actionStatus });
