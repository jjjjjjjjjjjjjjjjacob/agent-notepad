name: Repository checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bunx vitest run --maxWorkers=1
      - run: node --test .github/scripts/vouch-gate.test.cjs scripts/security/*.test.cjs
      - run: node scripts/security/tool.cjs actionlint -shellcheck=
  security:
    name: Secret and dependency scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: node scripts/security/scan.cjs secrets
      - run: node scripts/security/scan.cjs dependencies
      - run: node scripts/security/fixtures.cjs
  embeddings:
    name: Embedding image validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/security/verify-image.cjs
      - run: docker build --platform linux/amd64 -t agent-notepad-embeddings:ci services/embeddings
      - run: node scripts/security/scan.cjs image agent-notepad-embeddings:ci
      - run: node scripts/security/test-embeddings.cjs agent-notepad-embeddings:ci
