name: GitHub release
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Successful Vercel Production GitHub deployment ID for current main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-production-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'jjjjjjjjjjjjjjjjacob/agent-notepad' &&
      ((github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.environment == 'Production') ||
       (github.event_name == 'workflow_dispatch' &&
        github.actor == github.repository_owner && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
      deployments: read
    steps:
      # Fixed trusted branch, never a deployment-supplied checkout ref or PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Publish verified production version
        run: bun run release:github
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id || inputs.deployment_id }}
