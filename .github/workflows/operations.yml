name: Production operations
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun scripts/check-production.ts
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Authenticated encrypted recovery export
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_OPERATIONS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_DIRECTORY: ${{ runner.temp }}/encrypted-backups
          LEDGER_ONLY: ${{ github.event.schedule == '17 * * * *' && 'true' || 'false' }}
        run: |
          if [ "$LEDGER_ONLY" = "true" ]; then
            bun scripts/backup.ts --prod --ledger-only
          else
            bun scripts/backup.ts --prod
          fi
      - name: Retain only encrypted recovery files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-backups
          retention-days: 14
          if-no-files-found: error
