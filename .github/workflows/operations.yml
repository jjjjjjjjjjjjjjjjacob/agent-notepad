name: Production operations
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-operations
  cancel-in-progress: false
jobs:
  monitor:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun scripts/check-production.ts
  backup:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Assume the private backup storage role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ vars.BACKUP_AWS_REGION }}
          role-to-assume: ${{ vars.BACKUP_AWS_ROLE_ARN }}
          allowed-account-ids: ${{ vars.BACKUP_AWS_ACCOUNT_ID }}
          role-session-name: backup-${{ github.run_id }}
          role-duration-seconds: 3600
          unset-current-credentials: true
      - name: Authenticated encrypted recovery export
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_OPERATIONS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_AWS_ACCOUNT_ID: ${{ vars.BACKUP_AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.BACKUP_AWS_REGION }}
          LEDGER_ONLY: ${{ github.event.schedule == '17 * * * *' && 'true' || 'false' }}
        run: |
          if [ "$LEDGER_ONLY" = "true" ]; then
            bun scripts/backup-to-s3.ts --ledger-only
          else
            bun scripts/backup-to-s3.ts
          fi
