services:
  embeddings:
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      EMBEDDING_SERVICE_TOKEN: ${EMBEDDING_SERVICE_TOKEN:?Set a random secret of at least 32 characters}
      EMBEDDING_THREADS: "2"
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
